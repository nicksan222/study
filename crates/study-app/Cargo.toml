[package]
name = "study-app"
description = "The service the Study UI talks to: commands, queries, background work"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
study-rpc.workspace = true
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
study-ai.workspace = true
study-core.workspace = true
study-pipeline.workspace = true
study-media.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "signal", "fs"] }
tracing.workspace = true

[dev-dependencies]
h2 = "0.4"
bytes = "1"
http = "1"
url = "2"
study-ai = { workspace = true, features = ["testing"] }
study-core = { workspace = true, features = ["testing"] }
study-diagram.workspace = true
study-testkit.workspace = true
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true

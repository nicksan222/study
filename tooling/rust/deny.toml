# `cargo deny check`, run by `just check`: known vulnerabilities, licenses that fit
# MIT OR Apache-2.0, and crates only from crates.io.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# A vulnerability always fails. An unmaintained crate fails only when a Study crate depends on
# it directly; transitive dependencies are left to their owning crates.
unmaintained = "workspace"
yanked = "warn"

[licenses]
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft dependencies are used unmodified.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib"
]

[bans]
# Native dependencies use multiple versions of shared crates.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

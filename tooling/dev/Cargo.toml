[package]
name = "study-dev"
description = "Development-only workspace tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
shlex = "2"
tokio = { workspace = true, features = ["process", "time", "net"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process", "user", "fs"] }

[lints]
workspace = true

[package]
name = "study-desktop"
description = "Study's Tauri desktop shell and native device adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "study"

[lib]
name = "study_desktop"

[[bin]]
name = "study"
path = "src/main.rs"

[dependencies]
study-app.workspace = true
study-core.workspace = true
study-rpc = { path = "../../../crates/study-rpc" }
study-localization.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
tonic = { version = "0.14", features = ["transport"] }
cpal = "0.18"
webbrowser = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

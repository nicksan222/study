name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Resolve the current pull request head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.head.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check for root workspace changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -E '^(package(-lock)?\.json|apps/(client|desktop|server)/package\.json|packages/[^/]+/package\.json|tooling/package\.json)$'; then
            echo 'root=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        if: steps.changes.outputs.root == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Synchronize Bun lockfile
        if: steps.changes.outputs.root == 'true'
        run: |
          # Import npm's resolutions, including lockfile-only security updates.
          rm bun.lock
          bun install --lockfile-only --ignore-scripts

      - name: Publish lockfile and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ROOT_CHANGED: ${{ steps.changes.outputs.root }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- bun.lock; then
            git add -- bun.lock
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync Bun lockfile'
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" origin "HEAD:refs/heads/$HEAD_REF"
            HEAD_SHA=$(git rev-parse HEAD)
          fi
          if [ "$ROOT_CHANGED" = 'true' ]; then
            # GITHUB_TOKEN pushes do not trigger pull_request workflows.
            # Also dispatch on reruns after a previous push succeeded.
            for attempt in 1 2 3; do
              if gh workflow run ci.yml --ref "$HEAD_REF"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
          fi
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"

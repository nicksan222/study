name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/devcontainer

jobs:
  gates:
    name: 🦀 Native and package checks
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🧰 Set up build tools and dependencies
        id: setup
        uses: ./.github/actions/setup
        with:
          tools: cargo-deny@0.20.2
          target-dir: target/devcontainer

      # Keep the gates equivalent to `just check`. Run every gate after setup,
      # even if an earlier gate fails, so one run reports all package failures.
      - name: 🐚 Check shell scripts
        id: shell
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-shell

      - name: 🎨 Check formatting
        id: format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo fmt --all -- --check

      - name: 🔎 Lint Rust
        id: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: 🛡️ Audit Rust dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just deny

      - name: 🧩 Type-check server packages
        id: server_types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run server:typecheck

      - name: 🦀 Test native shell and Rust doctests
        id: native_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just test

      - name: 🗃️ Check generated database schema
        id: generated
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just gen-check

      - name: 📚 Build Rust documentation
        id: docs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just docs

      - name: 🥟 Smoke-test the packaged Bun server
        id: runtime
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bun run desktop:runtime
          python3 tooling/release/smoke_runtime.py target/desktop-runtime

      - name: 🌍 Check landing page
        id: landing
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just landing-check

      - name: 📋 Summarize results
        if: ${{ always() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          steps = json.loads(os.environ['STEPS'])
          labels = {
            'setup': '🧰 Setup',
            'shell': '🐚 Check shell scripts',
            'format': '🎨 Check formatting',
            'lint': '🔎 Lint Rust',
            'dependencies': '🛡️ Audit Rust dependencies',
            'server_types': '🧩 Type-check server packages',
            'native_tests': '🦀 Test native shell and Rust doctests',
            'generated': '🗃️ Check generated database schema',
            'docs': '📚 Build Rust documentation',
            'runtime': '🥟 Smoke-test the packaged Bun server',
            'landing': '🌍 Check landing page',
          }
          icons = {'success': '✅', 'failure': '❌', 'cancelled': '🚫', 'skipped': '⏭️'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## ✨ Study CI\n\n')
              summary.write('| Check | Result |\n| :--- | :--- |\n')
              for key, label in labels.items():
                  outcome = steps.get(key, {}).get('outcome', 'skipped')
                  summary.write(f'| {label} | {icons.get(outcome, "❔")} {outcome} |\n')
          PYTHON

  javascript:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🔎 Oxlint, formatting and Fallow
            task: lint
            command: npm run lint && npm run fallow:check
          - name: 🖼️ Web checks
            task: web
            command: npm run typecheck && npm run test && npm exec -- vp run --fail-if-no-match --filter @study/web build
          - name: 🛠️ Tooling tests
            task: tooling
            command: just tooling-test
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      # These checks do not need Rust or the Linux GUI toolchain.
      - name: 💚 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/landing/package.json
      - name: 📦 Install workspace dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --no-fund --no-audit
      - name: 🌍 Install landing dependencies for Fallow
        if: matrix.task == 'lint'
        working-directory: apps/landing
        run: bun install --frozen-lockfile
      - name: ⚙️ Install tooling test dependencies
        if: matrix.task == 'tooling'
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.40.0
      - name: 🔏 Install release test dependency
        if: matrix.task == 'tooling'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: 🧪 Run checks
        run: ${{ matrix.command }}

  server_tests:
    name: 🧪 Server tests
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      # This suite needs Node and SQLite, not the native Linux GUI toolchain.
      - name: 💚 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
      - name: 📦 Install workspace dependencies
        # CPU binaries are bundled; CI does not need the optional CUDA download.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --no-fund --no-audit
      - name: 🧪 Test server, AI, database and localization
        timeout-minutes: 10
        run: npm run server:test

  integrations:
    name: 🔌 Real integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/landing/package.json
      - name: 📦 Install workspace dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: bun install --frozen-lockfile --ignore-scripts
      - name: 🔌 Run every provider in a fresh Testcontainers environment
        run: bun run integrations:e2e

  check:
    # Required by the main branch ruleset; keep this name.
    name: Test and build
    needs: [gates, javascript, server_tests, integrations]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: 🏁 Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ['RESULTS'])
          icons = {'success': '✅', 'failure': '❌', 'cancelled': '🚫', 'skipped': '⏭️'}
          labels = {'gates': '🦀 Native and package checks', 'javascript': '🔎 JavaScript checks', 'server_tests': '🧪 Server tests', 'integrations': '🔌 Real integration tests'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## 🏁 Study CI\n\n| Check | Result |\n| :--- | :--- |\n')
              for name, job in results.items():
                  result = job['result']
                  summary.write(f"| {labels[name]} | {icons[result]} {result} |\n")
          sys.exit(any(job['result'] != 'success' for job in results.values()))
          PYTHON

  release:
    name: Release desktop app
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

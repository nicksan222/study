name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/devcontainer

jobs:
  gates:
    name: 🦀 Native and package checks
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: Restore Turbo task cache
        uses: ./.github/actions/turbo-cache

      - name: 🧰 Set up build tools and dependencies
        id: setup
        uses: ./.github/actions/setup
        with:
          tools: cargo-deny@0.20.2
          target-dir: target/devcontainer

      # Keep the gates equivalent to `bun run check`. Run every gate after setup,
      # even if an earlier gate fails, so one run reports all package failures.
      - name: 🐚 Check shell scripts
        id: shell
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-shell

      - name: 🎨 Check formatting
        id: format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run native:fmt

      - name: 🔎 Lint Rust
        id: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run native:lint

      - name: 🛡️ Audit Rust dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run deny

      - name: 🧩 Type-check server packages
        id: server_types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run server:typecheck

      - name: 🦀 Test native shell and Rust doctests
        id: native_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run native:test

      - name: 🗃️ Check generated database schema
        id: generated
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run gen-check

      - name: 📚 Build Rust documentation
        id: docs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run docs

      - name: 🥟 Smoke-test the packaged Bun server
        id: runtime
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bun run desktop:runtime
          python3 tooling/release/smoke_runtime.py target/desktop-runtime

      - name: 🌍 Check landing page
        id: landing
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run landing-check

      - name: 📋 Summarize results
        if: ${{ always() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          steps = json.loads(os.environ['STEPS'])
          labels = {
            'setup': '🧰 Setup',
            'shell': '🐚 Check shell scripts',
            'format': '🎨 Check formatting',
            'lint': '🔎 Lint Rust',
            'dependencies': '🛡️ Audit Rust dependencies',
            'server_types': '🧩 Type-check server packages',
            'native_tests': '🦀 Test native shell and Rust doctests',
            'generated': '🗃️ Check generated database schema',
            'docs': '📚 Build Rust documentation',
            'runtime': '🥟 Smoke-test the packaged Bun server',
            'landing': '🌍 Check landing page',
          }
          icons = {'success': '✅', 'failure': '❌', 'cancelled': '🚫', 'skipped': '⏭️'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## ✨ Study CI\n\n')
              summary.write('| Check | Result |\n| :--- | :--- |\n')
              for key, label in labels.items():
                  outcome = steps.get(key, {}).get('outcome', 'skipped')
                  summary.write(f'| {label} | {icons.get(outcome, "❔")} {outcome} |\n')
          PYTHON

  javascript:
    name: 🔎 JavaScript checks
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: Restore Turbo task cache
        uses: ./.github/actions/turbo-cache
      # These checks do not need Rust or the Linux GUI toolchain.
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/landing/package.json
      - name: 📦 Install workspace dependencies
        id: dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: bun install --frozen-lockfile
      - name: 🌍 Install landing dependencies for Fallow
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/landing
        run: bun install --frozen-lockfile
      - name: 🔏 Install release test dependency
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: 🔎 Check lint and formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run lint
      - name: 🔎 Check Fallow
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run fallow:check
      - name: 🧩 Type-check web packages
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run typecheck
      - name: 🧪 Test web packages
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run test:web
      - name: 🌐 Test browser flows in the canonical devcontainer
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: |
            CI=true
            GITHUB_SHA
          runCmd: bun run web:e2e
      - name: 📸 Retain browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - name: 🛠️ Test tooling
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run tooling-test

  server_tests:
    name: 🧪 Server tests
    runs-on: ubuntu-24.04
    env:
      # RAM-backed real files preserve WAL, locking, backup and process-restart coverage.
      TMPDIR: /dev/shm
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: Restore Turbo task cache
        uses: ./.github/actions/turbo-cache
      # This suite needs Bun and SQLite, not the native Linux GUI toolchain.
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/landing/package.json
      - name: 📦 Install workspace dependencies
        # CPU binaries are bundled; CI does not need the optional CUDA download.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: bun install --frozen-lockfile
      - name: 🧪 Test server, AI, database and localization
        timeout-minutes: 10
        run: bun run server:test

  integrations:
    name: 🔌 Real integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: Restore Turbo task cache
        uses: ./.github/actions/turbo-cache
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/landing/package.json
      - name: 📦 Install workspace dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: bun install --frozen-lockfile --ignore-scripts
      - name: 🔌 Run every provider in a fresh Testcontainers environment
        env:
          DEBUG: testcontainers:build
        run: bun run integrations:e2e

  check:
    # Required by the main branch ruleset; keep this name.
    name: Test and build
    needs: [gates, javascript, server_tests, integrations]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: 🏁 Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ['RESULTS'])
          icons = {'success': '✅', 'failure': '❌', 'cancelled': '🚫', 'skipped': '⏭️'}
          labels = {'gates': '🦀 Native and package checks', 'javascript': '🔎 JavaScript checks', 'server_tests': '🧪 Server tests', 'integrations': '🔌 Real integration tests'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## 🏁 Study CI\n\n| Check | Result |\n| :--- | :--- |\n')
              for name, job in results.items():
                  result = job['result']
                  summary.write(f"| {labels[name]} | {icons[result]} {result} |\n")
          sys.exit(any(job['result'] != 'success' for job in results.values()))
          PYTHON

  release:
    name: Release desktop app
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  release_cleanup:
    name: Keep only five published releases
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-cleanup
      cancel-in-progress: false
    steps:
      - name: Delete older releases and their assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest_id=$(gh api "repos/$GH_REPO/releases/latest" --jq '.id')
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          # Always retain the updater target when older builds finish out of order.
          jq --argjson latest "$latest_id" '
            [.[][] | select(.draft == false)]
            | sort_by([(.id == $latest), .published_at, .id]) | reverse
            | .[5:] | .[].id
          ' releases.json > obsolete-releases.txt
          while read -r release_id; do
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          done < obsolete-releases.txt

name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/devcontainer

# Start static checks first. Browser and server jobs require both static checks to pass.
jobs:
  hygiene:
    name: 🧹 Code hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
      - name: 🐚 Install shell checker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: ✨ Check formatting, architecture, code health and generated files
        run: bun run ci:hygiene

  types:
    name: 🧩 Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
      - name: 🔎 Typecheck JavaScript workspaces
        run: bun run ci:types

  client_unit:
    name: 🧪 Client unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
        with:
          task-cache-suffix: -${{ matrix.shard }}
      - name: 🧪 Run Vitest shard
        run: bun run ci:client-unit --shard=${{ matrix.shard }}/3
      - name: 📎 Retain test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-client-reports-${{ matrix.shard }}
          path: apps/client/test-results/vitest/*.xml
          if-no-files-found: ignore

  tooling_unit:
    name: 🧪 Tooling unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
      - name: 🧪 Run Vitest shard
        run: bun run ci:tooling-unit --shard=${{ matrix.shard }}/3
      - name: 📎 Retain test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-tooling-reports-${{ matrix.shard }}
          path: tooling/test-results/vitest/*.xml
          if-no-files-found: ignore

  server_tests:
    name: ⚙️ Server tests (${{ matrix.shard }}/3)
    needs: [hygiene, types]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    env:
      # Real files retain WAL, locking, backup and restart semantics.
      TMPDIR: /dev/shm
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
      - name: 🧪 Test feature services, RPC and workflows
        run: bun run ci:server --shard=${{ matrix.shard }}/3
      - name: 📎 Retain test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-server-reports-${{ matrix.shard }}
          path: apps/server/test-results/vitest/*.xml
          if-no-files-found: ignore

  recognition:
    name: 🎙️ Speech recognition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STUDY_VOICE_MODELS_DIR: target/voice-models
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        id: setup
        uses: ./.github/actions/setup-javascript
      - name: ♻️ Restore pinned recognition fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.STUDY_VOICE_MODELS_DIR }}
          key: study-voice-models-v1-${{ hashFiles('apps/server/src/features/voice/service/strategy.ts', 'apps/server/src/features/voice/service/strategies/**/*.ts') }}
      - name: 📦 Prepare and verify recognition fixtures
        id: voice_fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run voice:fixtures
      - name: 🎙️ Test every registered recognizer with human recordings
        if: ${{ !cancelled() && steps.voice_fixtures.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun run voice:test
      - name: 📎 Retain per-model recognition results
        if: ${{ !cancelled() && steps.voice_fixtures.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-voice-recognition
          path: tooling/test-results/vitest/voice.xml
          if-no-files-found: ignore

  shared_tests:
    name: 📦 Shared package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
      - name: 🔏 Install release test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: 🧪 Run shared package and Python tests
        run: bun run ci:shared
      - name: 📎 Retain test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-shared-reports
          path: '**/test-results/vitest/*.xml'
          if-no-files-found: ignore

  database:
    name: 🗄️ Database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: /dev/shm
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
      - name: 💾 Test schema, migrations and persistence
        run: bun run ci:database
      - name: 📎 Retain test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-database-reports
          path: '**/test-results/vitest/*.xml'
          if-no-files-found: ignore

  browser:
    name: 🌐 Browser journeys (${{ matrix.shard }}/3)
    needs: [hygiene, types]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: ♻️ Restore Turbo task cache
        uses: ./.github/actions/turbo-cache
      - name: 🎭 Run browser tests
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: |
            CI=true
            E2E_REVIEW=1
            GITHUB_SHA
          runCmd: bun run web:e2e:compare --shard=${{ matrix.shard }}/3
      - name: 📸 Retain screenshots, traces and browser reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-diagnostics-${{ matrix.shard }}
          path: apps/client/test-results/
          if-no-files-found: ignore
      - name: 🖼️ Collect Materials screenshots
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-materials-${{ matrix.shard }}
          path: |
            apps/client/test-results/playwright/review/linux-x64-chromium/material*/*.png
            apps/client/test-results/playwright/review/linux-x64-chromium/switch-among-*/*.png
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
          overwrite: true

  materials_gallery:
    name: 🖼️ Materials review gallery
    needs: [browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/landing/package.json
      - name: 📥 Download Materials captures
        uses: actions/download-artifact@v8
        with:
          pattern: web-e2e-materials-*
          path: target/materials-review-shards
      - name: 🖼️ Assemble Materials review gallery
        run: bun tooling/scripts/development/materials-gallery.ts target/materials-review-shards target/materials-gallery
      - name: 📦 Upload Materials review gallery
        id: materials_artifact
        uses: actions/upload-artifact@v7
        with:
          name: materials-gallery
          path: target/materials-gallery/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: 🔗 Link the gallery
        env:
          ARTIFACT_URL: ${{ steps.materials_artifact.outputs.artifact-url }}
        run: printf '%s\n' "[Download the Materials gallery](${ARTIFACT_URL}). Unzip and open index.html." >> "$GITHUB_STEP_SUMMARY"

  native:
    name: 🦀 Desktop & runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: ♻️ Restore Turbo task cache
        uses: ./.github/actions/turbo-cache
      - name: 🧰 Prepare Rust, Bun and desktop build libraries
        uses: ./.github/actions/setup
        with:
          tools: cargo-deny@0.20.2
          target-dir: target/devcontainer
      - name: 🦀 Check the native shell and smoke-test its private runtime
        run: bun run ci:native

  integrations:
    name: 🔌 Provider integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
        with:
          ignore-scripts: 'true'
      - name: 🧪 Run integration tests
        run: bun run integrations:e2e
      - name: 📎 Retain test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integrations-reports
          path: tooling/test-results/
          if-no-files-found: ignore

  landing:
    name: 🌍 Landing page
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🥟 Prepare Bun, dependencies and task cache
        uses: ./.github/actions/setup-javascript
      - name: 🌍 Validate and build the localized website
        run: bun run landing-check

  check:
    # Required by the main branch ruleset; keep this exact name.
    name: Test and build
    needs:
      [
        hygiene,
        types,
        client_unit,
        tooling_unit,
        server_tests,
        recognition,
        shared_tests,
        database,
        browser,
        materials_gallery,
        native,
        integrations,
        landing
      ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 🏁 Require every lane to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ['RESULTS'])
          icons = {'success': '✅', 'failure': '❌', 'cancelled': '🚫', 'skipped': '⏭️'}
          labels = {
              'hygiene': '🧹 Code hygiene',
              'types': '🧩 Typecheck',
              'client_unit': '🧪 Client unit tests',
              'tooling_unit': '🧪 Tooling unit tests',
              'server_tests': '⚙️ Server tests',
              'recognition': '🎙️ Speech recognition',
              'shared_tests': '📦 Shared package tests',
              'database': '🗄️ Database',
              'browser': '🌐 Browser journeys',
              'materials_gallery': '🖼️ Materials review gallery',
              'native': '🦀 Desktop & runtime',
              'integrations': '🔌 Provider integrations',
              'landing': '🌍 Landing page',
          }
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## 🏁 Study CI\n\n| Check | Result |\n| :--- | :--- |\n')
              for name, job in results.items():
                  result = job['result']
                  summary.write(f"| {labels[name]} | {icons[result]} {result} |\n")
          sys.exit(set(results) != set(labels) or any(job['result'] != 'success' for job in results.values()))
          PYTHON

  release:
    name: Release desktop app
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  release_cleanup:
    name: Keep only five published releases
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-cleanup
      cancel-in-progress: false
    steps:
      - name: Delete older releases and their assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest_id=$(gh api "repos/$GH_REPO/releases/latest" --jq '.id')
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          # Always retain the updater target when older builds finish out of order.
          jq --argjson latest "$latest_id" '
            [.[][] | select(.draft == false)]
            | sort_by([(.id == $latest), .published_at, .id]) | reverse
            | .[5:] | .[].id
          ' releases.json > obsolete-releases.txt
          while read -r release_id; do
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          done < obsolete-releases.txt

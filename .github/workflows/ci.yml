name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Required by the main branch ruleset; keep this name.
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          tools: cargo-deny@0.20.2
          packages: ffmpeg
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Check
        run: just check
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-e2e
          path: target/e2e
          if-no-files-found: ignore

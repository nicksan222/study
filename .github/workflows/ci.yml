name: CI

on:
  # A branch with a pull request is checked by the pull request run; a push run too would check
  # it twice.
  push:
    branches: [main]
  pull_request:
  # The Demo workflow starts this on the pull request it opens, which starts nothing by itself.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; main checks every commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Straight on the runner, no devcontainer (see .github/actions/setup). Lint and tests run in
# parallel, each with its own cache.
jobs:
  lint:
    name: Format, Clippy, docs and dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
        with:
          tools: cargo-deny@0.20.2
      - name: Check
        run: just check-shell fmt-check deny lint docs

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
        with:
          packages: ffmpeg
      # The runner's own Docker runs the tests that need real services (study-testkit).
      - name: Test
        run: just test

  done:
    # The one required check: its name is in the `main` ruleset, so keep it.
    name: Test and build
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null

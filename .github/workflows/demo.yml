name: Demo

# By hand only: records the README demo (`just demo`) from the branch it runs on and opens a
# pull request with the new assets/demo.gif.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  demo:
    name: Record and open a pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # To start CI on the pull request: one opened with this token starts nothing by itself.
      actions: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
        with:
          # The private headless desktop the showcase records on, with software Vulkan.
          packages: >-
            sway grim wtype wf-recorder ffmpeg
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl-mesa0
          # The app runs for real here, so it is built as in development.
          optimize-dependencies: 'true'
      - name: Record the demo
        run: just demo
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/demo.gif; then
            echo "::notice::The demo did not change."
            exit 0
          fi
          branch="demo/$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add assets/demo.gif
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update the demo"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "Update the demo" \
            --body "Recorded by the Demo workflow from $GITHUB_SHA."
          gh workflow run ci.yml --ref "$branch"

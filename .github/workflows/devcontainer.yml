name: Devcontainer

# CI runs on the runner, so this is what checks the devcontainer: it builds the image, starts
# the container and runs its lifecycle commands, as `devcontainer up` does for a contributor.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']
  push:
    branches: [main]
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']

permissions:
  contents: read

jobs:
  devcontainer:
    name: Build and start the devcontainer
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/landing/package.json
      - name: Build, start and run the lifecycle commands
        run: bunx --bun --package @devcontainers/cli@0.89.0 devcontainer up --workspace-folder .
      - name: Run a recipe inside
        run: bunx --bun --package @devcontainers/cli@0.89.0 devcontainer exec --workspace-folder . just --list

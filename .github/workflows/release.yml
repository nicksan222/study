name: Release

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  STUDY_UPDATE_PUBLIC_KEY: ${{ vars.STUDY_UPDATE_PUBLIC_KEY }}
  STUDY_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

jobs:
  version:
    name: 🔖 Version & signing
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Derive CI version and check signing keys
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
        run: |
          version=$(bash tooling/scripts/release/release.sh ci-version "$GITHUB_RUN_NUMBER")
          tag="v$version"
          published=$(gh release view "$tag" --json isDraft -q '.isDraft' 2>/dev/null || true)
          test "$published" != false || { echo 'Published release assets are immutable'; exit 1; }
          test -n "$STUDY_UPDATE_PUBLIC_KEY" || { echo 'Set STUDY_UPDATE_PUBLIC_KEY'; exit 1; }
          test -n "$SIGNING_KEY" || { echo 'Set TAURI_SIGNING_PRIVATE_KEY or CARGO_PACKAGER_SIGN_PRIVATE_KEY'; exit 1; }
          bash tooling/scripts/release/release.sh configure "$version" target/release-config.json > /dev/null
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

  linux_x64:
    name: 🐧 Linux x64
    needs: version
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: linux-x86_64
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  linux_arm64:
    name: 🐧 Linux ARM64
    needs: version
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: linux-aarch64
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  macos:
    name: 🍎 macOS ARM64
    needs: version
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: macos-aarch64
      runner: macos-15
      target: aarch64-apple-darwin
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  windows:
    name: 🪟 Windows x64
    needs: version
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: windows-x86_64
      runner: windows-2022
      target: x86_64-pc-windows-msvc
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    name: 🚀 Verify & publish release
    needs: [version, linux_x64, linux_arm64, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download all platform build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: target/release-input
      - name: Assemble one complete cryptographically verified update feed
        env:
          STUDY_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          STUDY_RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: bash tooling/scripts/release/release.sh assemble target/release-input target/release-output "$STUDY_RELEASE_VERSION" "$GITHUB_REPOSITORY" "$STUDY_RELEASE_TAG"
      - name: Upload and publish only the complete validated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDY_RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          published=$(gh release view "$STUDY_RELEASE_TAG" --json isDraft -q '.isDraft' 2>/dev/null || true)
          test "$published" != false || { echo 'Published release assets are immutable'; exit 1; }
          bash tooling/scripts/release/release.sh ensure-tag "$GITHUB_REPOSITORY" "$STUDY_RELEASE_TAG" "$GITHUB_SHA"
          if test -z "$published"; then
            gh release create "$STUDY_RELEASE_TAG" --draft --verify-tag --title "$STUDY_RELEASE_TAG" --generate-notes
          fi
          gh release upload "$STUDY_RELEASE_TAG" target/release-output/* --clobber
          release_id=$(gh release view "$STUDY_RELEASE_TAG" --json databaseId -q .databaseId)
          # Let GitHub select the highest semantic version when builds finish out of order.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=legacy > /dev/null

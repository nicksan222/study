name: Set up the runner
description: >-
  Installs what the package scripts need straight on the GitHub runner: the build subset of
  .devcontainer/Dockerfile's apt packages, Rust from rust-toolchain.toml, native tools, and a
  build cache. Keep the packages and pins aligned with the Dockerfile.

inputs:
  packages:
    description: More apt packages, space-separated.
    default: ''
  tools:
    description: More tools for taiki-e/install-action, comma-separated.
    default: ''
  target-dir:
    description: Cargo build output directory to cache.
    default: target
  optimize-dependencies:
    description: >-
      'false' builds dependencies unoptimized. Cargo.toml optimizes them even in dev builds so
      local models run at full speed; checks and tests run no model, and unoptimized
      dependencies compile several times faster.
    default: 'false'

runs:
  using: composite
  steps:
    - name: 📚 Install system packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # Use independent mirror DNS during the Ubuntu archive DNS outage.
        for mirror_list in /etc/apt/apt-mirrors*.txt; do
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee "$mirror_list" > /dev/null
        done
        sudo apt-get update
        # shellcheck disable=SC2086 # one word per package
        sudo apt-get install -y --no-install-recommends \
          pkg-config libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
          libssl-dev libzstd-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev dbus-x11 \
          shellcheck minisign sway $PACKAGES
    - name: 🥟 Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: apps/landing/package.json
    - name: Set up the ELF patcher
      shell: bash
      run: |
        bash .devcontainer/install-patchelf.sh "$RUNNER_TEMP/study-patchelf"
        printf 'PATCHELF=%s/bin/patchelf\n' "$RUNNER_TEMP/study-patchelf" >> "$GITHUB_ENV"
    - name: 📦 Install workspace dependencies
      shell: bash
      # CPU binaries are bundled; CI does not need the optional CUDA download.
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: bun install --frozen-lockfile
    - name: 🌍 Install landing dependencies
      shell: bash
      working-directory: apps/landing
      run: bun install --frozen-lockfile
    - name: 🦀 Install Rust
      shell: bash
      run: rustup toolchain install
    - name: ⚙️ Install native tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}
    - name: 🚀 Configure fast dependency builds
      if: inputs.optimize-dependencies == 'false'
      shell: bash
      run: |
        mkdir -p ~/.cargo
        printf '[profile.dev.package."*"]\nopt-level = 0\n' >> ~/.cargo/config.toml
    - name: ♻️ Restore build cache
      uses: Swatinem/rust-cache@v2
      with:
        # Every branch saves its own cache. A pull request's first run restores main's, so it
        # recompiles only what it changed; its later runs restore its own.
        key: optimize-dependencies-${{ inputs.optimize-dependencies }}
        workspaces: . -> ${{ inputs.target-dir }}

name: Turbo cache
description: Restore task results; Turbo validates source, configuration and environment hashes.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.job }}-
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-

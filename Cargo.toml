[workspace]
resolver = "2"
members = ["tooling/dev", "tooling/web-bridge", "crates/study-rpc", "apps/desktop/src-tauri", "crates/study-core", "crates/study-diagram", "crates/study-localization", "crates/study-app", "crates/study-media", "crates/study-ai", "crates/study-pipeline", "crates/study-testkit", "crates/study-showcase", "crates/study-seed"]
default-members = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicksan222/study"

[workspace.dependencies]
roughr = "0.14"
rust-sugiyama = "0.4"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
study-media = { path = "crates/study-media" }
study-ai = { path = "crates/study-ai" }
study-pipeline = { path = "crates/study-pipeline" }
study-core = { path = "crates/study-core" }
study-app = { path = "crates/study-app" }
study-rpc = { path = "crates/study-rpc" }
study-diagram = { path = "crates/study-diagram" }
study-testkit = { path = "crates/study-testkit" }
study-seed = { path = "crates/study-seed" }
testcontainers = "0.28"
study-localization = { path = "crates/study-localization" }

# Shared by every member through `[lints] workspace = true`.
[workspace.lints.clippy]
# Libraries and the app log through `tracing`; only CLIs, examples and tests print.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Full debug info made every app and test binary about 1.8 GB. Line tables keep file:line in
# backtraces; set `CARGO_PROFILE_DEV_DEBUG=true` for a session that needs variables in lldb.
[profile.dev]
debug = "line-tables-only"

# Keep numerical kernels and the first-launch benchmark optimized: debug kernels would
# understate the machine's local inference capacity.
[profile.dev.package."*"]
opt-level = 3
debug = false

